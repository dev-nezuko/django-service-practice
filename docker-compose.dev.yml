version: '3.8'

services:
 db:
  image: postgres:15
  ports: 
  - 127.0.0.1:5444:5432
  environment:
   - POSTGRES_USER=docker
   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
   - POSTGRES_DB=tmt_interview
  volumes:
  - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
